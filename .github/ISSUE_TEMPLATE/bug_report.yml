name: Relatório de bug
 description: Relate um problema reproduzível na DEMO
 title: "[Bug]: "
 labels: ["bug"]
 body:
  - type: markdown
    attributes:
      value: "Obrigado por ajudar. Não inclua dados pessoais, credenciais ou segredos."
  - type: textarea
    id: summary
    attributes:
      label: Descrição
      description: O que aconteceu e o que você esperava que acontecesse?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Passos mínimos para reproduzir o problema.
      placeholder: "1. Abra a DEMO\n2. ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador e versão
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs ou capturas de tela
      description: Remova informações pessoais antes de anexar.
    validations:
      required: false
